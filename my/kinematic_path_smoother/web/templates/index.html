<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinematic Path Smoother Workbench</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="app-shell">
    <aside class="control-rail">
      <header class="app-header">
        <div>
          <p class="app-kicker">Nav2 Lab</p>
          <h1>Kinematic Smoother</h1>
        </div>
        <span id="backend-badge" class="status-chip">{{ "C++" if native_available else "Python" }}</span>
      </header>

      <nav class="tabs" aria-label="参数分组">
        <button type="button" class="tab is-active" data-panel="scene-panel">场景</button>
        <button type="button" class="tab" data-panel="cost-panel">代价</button>
        <button type="button" class="tab" data-panel="constraint-panel">约束</button>
        <button type="button" class="tab" data-panel="view-panel">图层</button>
      </nav>

      <section id="scene-panel" class="panel is-active">
        <div class="field-grid">
          <label>起点 X<input id="start-x" type="number" step="0.05"></label>
          <label>起点 Y<input id="start-y" type="number" step="0.05"></label>
          <label>终点 X<input id="goal-x" type="number" step="0.05"></label>
          <label>终点 Y<input id="goal-y" type="number" step="0.05"></label>
        </div>
        <label class="range-field">起点朝向 <output id="start-yaw-value"></output>
          <input id="start-yaw" type="range" min="-180" max="180" step="1">
        </label>
        <label class="range-field">终点朝向 <output id="goal-yaw-value"></output>
          <input id="goal-yaw" type="range" min="-180" max="180" step="1">
        </label>
        <label class="range-field">参考采样 <output id="reference-stride-value"></output>
          <input id="reference-stride" type="range" min="1" max="10" step="1" value="4">
        </label>
      </section>

      <section id="cost-panel" class="panel">
        <label class="range-field">模型权重 <output id="model-weight-value"></output>
          <input id="model-weight" type="range" min="0" max="40" step="0.5" value="8">
        </label>
        <label class="range-field">参考权重 <output id="reference-weight-value"></output>
          <input id="reference-weight" type="range" min="0" max="10" step="0.1" value="0.5">
        </label>
        <label class="range-field">曲率权重 <output id="curvature-weight-value"></output>
          <input id="curvature-weight" type="range" min="0" max="10" step="0.1" value="0.2">
        </label>
        <label class="range-field">曲率变化 <output id="curvature-rate-weight-value"></output>
          <input id="curvature-rate-weight" type="range" min="0" max="20" step="0.1" value="1.0">
        </label>
        <label class="range-field">长度权重 <output id="length-weight-value"></output>
          <input id="length-weight" type="range" min="0" max="2" step="0.01" value="0.01">
        </label>
        <label class="range-field">最大曲率 <output id="max-curvature-value"></output>
          <input id="max-curvature" type="range" min="0.2" max="8" step="0.1" value="2.5">
        </label>
      </section>

      <section id="constraint-panel" class="panel">
        <label class="toggle"><input id="keep-start" type="checkbox" checked><span>固定起点朝向</span></label>
        <label class="toggle"><input id="keep-goal" type="checkbox" checked><span>固定终点朝向</span></label>
        <label class="range-field">纵向容差 <output id="goal-lon-tol-value"></output>
          <input id="goal-lon-tol" type="range" min="0" max="1.5" step="0.05" value="0">
        </label>
        <label class="range-field">横向容差 <output id="goal-lat-tol-value"></output>
          <input id="goal-lat-tol" type="range" min="0" max="1.5" step="0.05" value="0">
        </label>
        <label class="range-field">Footprint 半径 <output id="footprint-radius-value"></output>
          <input id="footprint-radius" type="range" min="0" max="0.5" step="0.02" value="0.18">
        </label>
        <label class="range-field">输出上采样 <output id="upsample-value"></output>
          <input id="upsample" type="range" min="1" max="10" step="1" value="4">
        </label>
        <label class="range-field">最大迭代 <output id="max-iterations-value"></output>
          <input id="max-iterations" type="range" min="10" max="160" step="5" value="60">
        </label>
      </section>

      <section id="view-panel" class="panel">
        <label class="toggle"><input id="layer-costmap" type="checkbox" checked><span>代价地图</span></label>
        <label class="toggle"><input id="layer-grid" type="checkbox" checked><span>网格</span></label>
        <label class="toggle"><input id="layer-raw" type="checkbox" checked><span>A*</span></label>
        <label class="toggle"><input id="layer-reference" type="checkbox" checked><span>参考路径</span></label>
        <label class="toggle"><input id="layer-smooth" type="checkbox" checked><span>平滑路径</span></label>
        <label class="toggle"><input id="layer-knots" type="checkbox" checked><span>优化点</span></label>
        <label class="toggle"><input id="layer-footprint" type="checkbox"><span>Footprint</span></label>
      </section>

      <footer class="rail-actions">
        <button id="solve-btn" type="button" class="primary-action">运行</button>
        <button id="reset-btn" type="button" class="secondary-action">重置</button>
      </footer>
    </aside>

    <section class="workbench">
      <header class="top-strip">
        <div class="run-state">
          <strong id="status-line">Ready</strong>
          <span id="stats-line">--</span>
        </div>
        <div class="metric-row">
          <div class="metric"><span>Raw</span><strong id="metric-raw-length">--</strong></div>
          <div class="metric"><span>Ref</span><strong id="metric-ref-length">--</strong></div>
          <div class="metric"><span>Smooth</span><strong id="metric-smooth-length">--</strong></div>
          <div class="metric"><span>Peak k</span><strong id="metric-peak-curvature">--</strong></div>
        </div>
      </header>

      <div class="map-stage">
        <canvas id="map" width="1280" height="760"></canvas>
        <div id="cursor-readout" class="cursor-readout">--</div>
      </div>

      <section class="analysis-band">
        <div class="chart-panel">
          <div class="panel-heading">
            <h2>曲率剖面</h2>
            <span id="curvature-summary">--</span>
          </div>
          <canvas id="curvature-chart" width="520" height="150"></canvas>
        </div>
        <div class="chart-panel">
          <div class="panel-heading">
            <h2>段距剖面</h2>
            <span id="spacing-summary">--</span>
          </div>
          <canvas id="spacing-chart" width="520" height="150"></canvas>
        </div>
        <div class="diagnostic-panel">
          <div class="panel-heading">
            <h2>诊断</h2>
            <span id="diagnostic-status">--</span>
          </div>
          <dl class="diagnostics">
            <div><dt>Backend</dt><dd id="diag-backend">--</dd></div>
            <div><dt>Time</dt><dd id="diag-time">--</dd></div>
            <div><dt>Knots</dt><dd id="diag-knots">--</dd></div>
            <div><dt>Failure</dt><dd id="diag-failure">--</dd></div>
          </dl>
        </div>
      </section>
    </section>
  </main>

  <script>
    window.DEFAULT_SCENE = {
      width: {{ spec.width }},
      height: {{ spec.height }},
      resolution: {{ spec.resolution }},
      origin_x: {{ spec.origin_x }},
      origin_y: {{ spec.origin_y }},
      start: {{ start | tojson }},
      goal: {{ goal | tojson }},
      obstacles: {{ obstacles | tojson }},
      native_available: {{ native_available | tojson }}
    };
  </script>
  <script src="/static/js/app.js"></script>
</body>
</html>
