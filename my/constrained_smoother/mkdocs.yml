site_name: Constrained Smoother
site_description: 独立运动学平滑器设计与实现文档
repo_url: https://github.com/ros-navigation/navigation2
repo_name: ros-navigation/navigation2

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 概览: index.md
  - 包使用指南: package-guide.md
  - 设计:
      - 运动学平滑器: KINEMATIC_SMOOTHER_DESIGN.md
      - 可复现设计文档: REPRODUCIBLE_DESIGN.md
  - 参考:
      - 错误码: error-codes.md